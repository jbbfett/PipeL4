name: Distribution validation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produce_canonical:
    name: Produce packages (.NET SDK 10.0.115; canonical)
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.published.outputs.artifact_name }}
      producer_attempt: ${{ steps.published.outputs.producer_attempt }}
    env:
      SDK_VERSION: '10.0.115'
      PRODUCER_ROLE: canonical
    steps: &producer_steps
      - name: Check out tested source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install producer .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Record tested source revision
        id: source_revision
        shell: bash
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          if [[ "$tested_sha" != "$GITHUB_SHA" ]]; then
            echo "Checkout provenance mismatch: HEAD is $tested_sha; GITHUB_SHA is $GITHUB_SHA." >&2
            exit 1
          fi
          printf 'sha=%s\n' "$tested_sha" >> "$GITHUB_OUTPUT"

      - name: Prepare producer artifact directories
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="artifacts/producer-sdk-${SDK_VERSION}-${PRODUCER_ROLE}"
          if [[ -e "$artifact_root" ]]; then
            echo "Producer artifact directory already exists: $artifact_root" >&2
            exit 1
          fi
          mkdir -p "$artifact_root/packages/PipeL4" "$artifact_root/packages/PipeL4.Plugins"
          artifact_name="PipeL4-${PRODUCER_ROLE}-sdk-${SDK_VERSION}-source-${GITHUB_SHA}-attempt-${GITHUB_RUN_ATTEMPT}"
          printf 'root=%s\n' "$artifact_root" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=%s\n' "$artifact_name" >> "$GITHUB_OUTPUT"
          printf 'producer_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Select and verify exact .NET SDK
        env:
          ARTIFACT_ROOT: ${{ steps.artifacts.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          cp global.json "$RUNNER_TEMP/pipel4-global.json"
          jq --arg sdk "$SDK_VERSION" '.sdk.version = $sdk | .sdk.rollForward = "disable"' \
            global.json > "$RUNNER_TEMP/pipel4-producer-global.json"
          cp "$RUNNER_TEMP/pipel4-producer-global.json" global.json
          selected_sdk="$(dotnet --version)"
          printf 'Requested .NET SDK: %s; selected .NET SDK: %s\n' "$SDK_VERSION" "$selected_sdk"
          if [[ "$selected_sdk" != "$SDK_VERSION" ]]; then
            echo "SDK selection failed: expected $SDK_VERSION, got $selected_sdk." >&2
            exit 1
          fi
          dotnet --info | tee "$ARTIFACT_ROOT/dotnet-info.txt"
          dotnet --list-sdks | tee "$ARTIFACT_ROOT/installed-sdks.txt"

          # Paket appends NU1605 during target execution; remove its suppression and preserve the existing error list.
          warning_policy_targets="$RUNNER_TEMP/pipel4-ci-warning-policy.targets"
          cat > "$warning_policy_targets" <<'EOF'
          <Project>
            <Target Name="Pipel4EnforceNu1605AfterPaket" AfterTargets="PaketRestore">
              <PropertyGroup>
                <NoWarn>$([System.Text.RegularExpressions.Regex]::Replace('$(NoWarn)', '(?i)(^|[;,])\s*NU1605\s*(?=[;,]|$)', '$1'))</NoWarn>
                <WarningsAsErrors>$(WarningsAsErrors);NU1605</WarningsAsErrors>
              </PropertyGroup>
            </Target>
          </Project>
          EOF

      - name: Restore Paket tool
        run: dotnet tool restore

      - name: Restore Paket dependencies
        run: dotnet paket restore

      - name: Clean Release outputs
        run: dotnet clean PipeL4.sln --configuration Release -m:1 -p:PaketDisableCliTest=true -p:BuildInParallel=false

      - name: Restore dependencies
        shell: bash
        run: CustomAfterMicrosoftCommonTargets="$RUNNER_TEMP/pipel4-ci-warning-policy.targets" dotnet restore PipeL4.sln -p:PaketDisableCliTest=true -p:BuildInParallel=false

      - name: Build Release
        run: dotnet build PipeL4.sln --configuration Release --no-restore -p:PaketDisableCliTest=true

      - name: Read expected shared package version
        id: package_version
        shell: bash
        run: |
          set -euo pipefail
          tool_version="$(dotnet msbuild src/PipeL4/PipeL4.fsproj -getProperty:Version -nologo)"
          api_version="$(dotnet msbuild src/PipeL4.Plugins/PipeL4.Plugins.fsproj -getProperty:Version -nologo)"
          if [[ -z "$tool_version" || "$tool_version" != "$api_version" ]]; then
            echo "Package version mismatch: PipeL4='$tool_version', PipeL4.Plugins='$api_version'." >&2
            exit 1
          fi
          printf 'version=%s\n' "$tool_version" >> "$GITHUB_OUTPUT"

      - name: Create .NET Tool package
        env:
          ARTIFACT_ROOT: ${{ steps.artifacts.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          pack_log="$RUNNER_TEMP/pipel4-pack.log"
          dotnet pack src/PipeL4/PipeL4.fsproj \
            --configuration Release \
            --no-restore \
            -p:PaketDisableCliTest=true \
            -p:BuildInParallel=false \
            --output "$ARTIFACT_ROOT/packages/PipeL4" 2>&1 | tee "$pack_log"
          if grep -F "NU5046" "$pack_log"; then
            echo "Package validation failed: dotnet pack reported a missing package README (NU5046)." >&2
            exit 1
          fi

      - name: Create public API package
        env:
          ARTIFACT_ROOT: ${{ steps.artifacts.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          pack_log="$RUNNER_TEMP/pipel4-public-api-pack.log"
          dotnet pack src/PipeL4.Plugins/PipeL4.Plugins.fsproj \
            --configuration Release \
            --no-restore \
            -p:PaketDisableCliTest=true \
            -p:BuildInParallel=false \
            --output "$ARTIFACT_ROOT/packages/PipeL4.Plugins" 2>&1 | tee "$pack_log"
          if grep -F "NU5046" "$pack_log"; then
            echo "Package validation failed: dotnet pack reported a missing public API package README (NU5046)." >&2
            exit 1
          fi

      - name: Verify package validator failure handling
        if: ${{ env.PRODUCER_ROLE == 'canonical' }}
        env:
          ARTIFACT_ROOT: ${{ steps.artifacts.outputs.root }}
        run: dotnet fsi scripts/test_validation_exit_codes.fsx "$ARTIFACT_ROOT/packages/PipeL4"

      - name: Validate package metadata and contents
        id: package
        env:
          ARTIFACT_ROOT: ${{ steps.artifacts.outputs.root }}
          EXPECTED_PACKAGE_VERSION: ${{ steps.package_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$ARTIFACT_ROOT/packages/PipeL4"
          api_dir="$ARTIFACT_ROOT/packages/PipeL4.Plugins"
          mapfile -t tool_packages < <(find "$tool_dir" -maxdepth 1 -type f -name '*.nupkg' -print)
          mapfile -t api_packages < <(find "$api_dir" -maxdepth 1 -type f -name '*.nupkg' -print)
          if [[ ${#tool_packages[@]} -ne 1 ]]; then
            echo "Tool package validation failed: expected one PipeL4 package, found ${#tool_packages[@]}." >&2
            exit 1
          fi
          if [[ ${#api_packages[@]} -ne 1 ]]; then
            echo "Public API package validation failed: expected one PipeL4.Plugins package, found ${#api_packages[@]}." >&2
            exit 1
          fi
          tool_package="${tool_packages[0]}"
          api_package="${api_packages[0]}"
          tool_package_name="${tool_package##*/}"
          api_package_name="${api_package##*/}"
          if [[ "$tool_package_name" != "PipeL4.${EXPECTED_PACKAGE_VERSION}.nupkg" ]]; then
            echo "Unexpected tool package filename '$tool_package_name'." >&2
            exit 1
          fi
          if [[ "$api_package_name" != "PipeL4.Plugins.${EXPECTED_PACKAGE_VERSION}.nupkg" ]]; then
            echo "Unexpected public API package filename '$api_package_name'." >&2
            exit 1
          fi
          dotnet fsi scripts/validate_package.fsx "$tool_package"
          dotnet fsi scripts/validate_public_api_package.fsx "$api_package"
          printf 'Validated lockstep package version %s.\n' "$EXPECTED_PACKAGE_VERSION"
          printf 'package_version=%s\n' "$EXPECTED_PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'tool_package_path=%s\n' "$(realpath "$tool_package")" >> "$GITHUB_OUTPUT"
          printf 'public_api_package_path=%s\n' "$(realpath "$api_package")" >> "$GITHUB_OUTPUT"

      - name: Run regression suite against canonical release candidate
        if: ${{ env.PRODUCER_ROLE == 'canonical' }}
        env:
          PIPEL4_PACKAGE_PATH: ${{ steps.package.outputs.tool_package_path }}
        run: dotnet test --solution PipeL4.sln --configuration Release --no-restore -p:PaketDisableCliTest=true -p:BuildInParallel=false

      - name: Record package provenance and verify artifact hashes
        env:
          ARTIFACT_ROOT: ${{ steps.artifacts.outputs.root }}
          PACKAGE_VERSION: ${{ steps.package.outputs.package_version }}
          TESTED_SHA: ${{ steps.source_revision.outputs.sha }}
          TOOL_PACKAGE_PATH: ${{ steps.package.outputs.tool_package_path }}
          PUBLIC_API_PACKAGE_PATH: ${{ steps.package.outputs.public_api_package_path }}
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$ARTIFACT_ROOT/packages/PipeL4"
          api_dir="$ARTIFACT_ROOT/packages/PipeL4.Plugins"
          tool_package="$tool_dir/PipeL4.${PACKAGE_VERSION}.nupkg"
          api_package="$api_dir/PipeL4.Plugins.${PACKAGE_VERSION}.nupkg"
          test "$(realpath "$tool_package")" = "$TOOL_PACKAGE_PATH"
          test "$(realpath "$api_package")" = "$PUBLIC_API_PACKAGE_PATH"
          tool_nuspec="PipeL4.nuspec"
          api_nuspec="PipeL4.Plugins.nuspec"
          if ! unzip -p "$tool_package" "$tool_nuspec" | grep -Fq "commit=\"$TESTED_SHA\""; then
            echo "Tool package repository commit does not match tested checkout $TESTED_SHA." >&2
            exit 1
          fi
          if ! unzip -p "$api_package" "$api_nuspec" | grep -Fq "commit=\"$TESTED_SHA\""; then
            echo "Public API package repository commit does not match tested checkout $TESTED_SHA." >&2
            exit 1
          fi
          printf '%s\n' "$TESTED_SHA" > "$tool_dir/source-revision.txt"
          printf '%s\n' "$TESTED_SHA" > "$api_dir/source-revision.txt"
          test "$(cat "$tool_dir/source-revision.txt")" = "$TESTED_SHA"
          test "$(cat "$api_dir/source-revision.txt")" = "$TESTED_SHA"

          tool_relative_path="packages/PipeL4/$(basename "$tool_package")"
          api_relative_path="packages/PipeL4.Plugins/$(basename "$api_package")"
          tool_workspace_path="$ARTIFACT_ROOT/$tool_relative_path"
          api_workspace_path="$ARTIFACT_ROOT/$api_relative_path"
          tool_sha256="$(sha256sum "$tool_package" | cut -d ' ' -f 1)"
          api_sha256="$(sha256sum "$api_package" | cut -d ' ' -f 1)"

          jq -n \
            --arg sdk "$SDK_VERSION" \
            --arg role "$PRODUCER_ROLE" \
            --arg tested_sha "$TESTED_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg version "$PACKAGE_VERSION" \
            --arg tool_path "$tool_relative_path" \
            --arg tool_workspace_path "$tool_workspace_path" \
            --arg tool_sha256 "$tool_sha256" \
            --arg tool_revision "$(cat "$tool_dir/source-revision.txt")" \
            --arg api_path "$api_relative_path" \
            --arg api_workspace_path "$api_workspace_path" \
            --arg api_sha256 "$api_sha256" \
            --arg api_revision "$(cat "$api_dir/source-revision.txt")" \
            '{
              format_version: 1,
              producer: { sdk: $sdk, role: $role },
              run_id: ($run_id | tonumber),
              run_attempt: ($attempt | tonumber),
              tested_checkout_sha: $tested_sha,
              packages: [
                { id: "PipeL4", version: $version, path: $tool_path, workspace_path: $tool_workspace_path, sha256: $tool_sha256, source_revision: $tool_revision, source_revision_file: "packages/PipeL4/source-revision.txt" },
                { id: "PipeL4.Plugins", version: $version, path: $api_path, workspace_path: $api_workspace_path, sha256: $api_sha256, source_revision: $api_revision, source_revision_file: "packages/PipeL4.Plugins/source-revision.txt" }
              ]
            }' > "$ARTIFACT_ROOT/manifest.json"

          (
            cd "$ARTIFACT_ROOT"
            sha256sum \
              "packages/PipeL4/$(basename "$tool_package")" \
              packages/PipeL4/source-revision.txt \
              "packages/PipeL4.Plugins/$(basename "$api_package")" \
              packages/PipeL4.Plugins/source-revision.txt > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          jq -e \
            --arg sdk "$SDK_VERSION" \
            --arg role "$PRODUCER_ROLE" \
            --arg tested_sha "$TESTED_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg tool_sha "$tool_sha256" \
            --arg api_sha "$api_sha256" \
            '.producer.sdk == $sdk and .producer.role == $role and .run_id == ($run_id | tonumber) and .run_attempt == ($attempt | tonumber) and .tested_checkout_sha == $tested_sha and .packages[0].sha256 == $tool_sha and .packages[1].sha256 == $api_sha' \
            "$ARTIFACT_ROOT/manifest.json" > /dev/null

      - name: Upload producer packages and provenance
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifacts.outputs.artifact_name }}
          path: ${{ steps.artifacts.outputs.root }}/
          if-no-files-found: error

      - name: Publish uploaded producer artifact identity
        id: published
        env:
          ARTIFACT_NAME: ${{ steps.artifacts.outputs.artifact_name }}
          PRODUCER_ATTEMPT: ${{ steps.artifacts.outputs.producer_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ARTIFACT_NAME" || -z "$PRODUCER_ATTEMPT" ]]; then
            echo "Uploaded producer artifact identity is missing." >&2
            exit 1
          fi
          printf 'artifact_name=%s\n' "$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          printf 'producer_attempt=%s\n' "$PRODUCER_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Restore SDK policy and verify dependency files are unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/pipel4-global.json" ]]; then
            cp "$RUNNER_TEMP/pipel4-global.json" global.json
          fi
          git diff --exit-code -- global.json paket.dependencies paket.lock

  produce_compatibility:
    name: Produce packages (.NET SDK 10.0.404; compatibility)
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: ${{ steps.published.outputs.artifact_name }}
      producer_attempt: ${{ steps.published.outputs.producer_attempt }}
    env:
      SDK_VERSION: '10.0.404'
      PRODUCER_ROLE: compatibility
    steps: *producer_steps

  consume_115_from_115:
    name: Consume canonical packages with .NET SDK 10.0.115 from producer SDK 10.0.115
    runs-on: ubuntu-24.04
    needs: produce_canonical
    env:
      SDK_VERSION: '10.0.115'
      PRODUCER_SDK: '10.0.115'
      PRODUCER_ROLE: canonical
      PRODUCER_ARTIFACT_NAME: ${{ needs.produce_canonical.outputs.artifact_name }}
      PRODUCER_ARTIFACT_ATTEMPT: ${{ needs.produce_canonical.outputs.producer_attempt }}
    steps: &consumer_steps
      - name: Check out tested source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install both supported .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.115
            10.0.404

      - name: Pin and verify exact consumer SDK
        env:
          SDK_VERSION: ${{ env.SDK_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          cp global.json "$RUNNER_TEMP/pipel4-global.json"
          jq --arg sdk "$SDK_VERSION" '.sdk.version = $sdk | .sdk.rollForward = "disable"' \
            global.json > "$RUNNER_TEMP/pipel4-consumer-global.json"
          cp "$RUNNER_TEMP/pipel4-consumer-global.json" global.json
          selected_sdk="$(dotnet --version)"
          printf 'Requested consumer .NET SDK: %s; selected .NET SDK: %s\n' "$SDK_VERSION" "$selected_sdk"
          if [[ "$selected_sdk" != "$SDK_VERSION" ]]; then
            echo "Consumer SDK selection failed: expected $SDK_VERSION, got $selected_sdk." >&2
            exit 1
          fi
          dotnet --info | tee "$RUNNER_TEMP/pipel4-consumer-dotnet-info.txt"
          dotnet --list-sdks | tee "$RUNNER_TEMP/pipel4-consumer-installed-sdks.txt"
          other_sdk=10.0.115
          if [[ "$SDK_VERSION" == "10.0.115" ]]; then other_sdk=10.0.404; fi
          grep -F "$SDK_VERSION [" "$RUNNER_TEMP/pipel4-consumer-installed-sdks.txt"
          grep -F "$other_sdk [" "$RUNNER_TEMP/pipel4-consumer-installed-sdks.txt"

      - name: Verify checked out source revision and prepare isolated caches
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          if [[ "$tested_sha" != "$GITHUB_SHA" ]]; then
            echo "Checkout provenance mismatch: HEAD is $tested_sha; GITHUB_SHA is $GITHUB_SHA." >&2
            exit 1
          fi
          consumer_root="$RUNNER_TEMP/pipel4-consumer-${SDK_VERSION}-from-${PRODUCER_SDK}"
          package_cache="$consumer_root/outer-packages"
          http_cache="$consumer_root/outer-http-cache"
          cli_home="$consumer_root/cli-home"
          mkdir -p "$consumer_root" "$package_cache" "$http_cache" "$cli_home"
          printf 'NUGET_PACKAGES=%s\n' "$package_cache" >> "$GITHUB_ENV"
          printf 'NUGET_HTTP_CACHE_PATH=%s\n' "$http_cache" >> "$GITHUB_ENV"
          printf 'DOTNET_CLI_HOME=%s\n' "$cli_home" >> "$GITHUB_ENV"
          printf 'root=%s\n' "$consumer_root" >> "$GITHUB_OUTPUT"

      - name: Validate trusted producer artifact outputs
        id: producer_identity
        env:
          PRODUCER_ARTIFACT_NAME: ${{ env.PRODUCER_ARTIFACT_NAME }}
          PRODUCER_ARTIFACT_ATTEMPT: ${{ env.PRODUCER_ARTIFACT_ATTEMPT }}
        run: >-
          dotnet fsi --exec scripts/distribution_validation.fsx select-artifact
          --artifact-name "$PRODUCER_ARTIFACT_NAME"
          --producer-attempt "$PRODUCER_ARTIFACT_ATTEMPT"
          --producer-sdk "$PRODUCER_SDK"
          --tested-sha "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --github-output "$GITHUB_OUTPUT"

      - name: Download only the selected producer artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ steps.producer_identity.outputs.artifact_name }}
          path: ${{ runner.temp }}/pipel4-distribution-${{ env.SDK_VERSION }}-from-${{ env.PRODUCER_SDK }}

      - name: Verify artifact provenance and candidate package bytes
        id: candidate
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/pipel4-distribution-${{ env.SDK_VERSION }}-from-${{ env.PRODUCER_SDK }}
          PRODUCER_ARTIFACT_ATTEMPT: ${{ steps.producer_identity.outputs.producer_attempt }}
        run: >-
          dotnet fsi --exec scripts/distribution_validation.fsx artifact
          --artifact-root "$ARTIFACT_ROOT"
          --consumer-sdk "$SDK_VERSION"
          --producer-sdk "$PRODUCER_SDK"
          --tested-sha "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --producer-attempt "$PRODUCER_ARTIFACT_ATTEMPT"
          --github-output "$GITHUB_OUTPUT"

      - name: Test distribution rejection controls
        if: ${{ env.SDK_VERSION == '10.0.115' && env.PRODUCER_ROLE == 'canonical' }}
        run: dotnet fsi --exec scripts/distribution_validation.fsx self-test

      - name: Restore trusted FSharp.Core minimum package in a fresh cache
        env:
          CONSUMER_ROOT: ${{ steps.prepare.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          prerequisite="$CONSUMER_ROOT/fsharp-core-prerequisite"
          mkdir -p "$prerequisite"
          cat > "$prerequisite/FSharpCorePrerequisite.fsproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <DisableImplicitFSharpCoreReference>true</DisableImplicitFSharpCoreReference>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="FSharp.Core" Version="10.0.100" />
            </ItemGroup>
          </Project>
          EOF
          cat > "$prerequisite/NuGet.Config" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="NuGet.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          dotnet restore "$prerequisite/FSharpCorePrerequisite.fsproj" \
            --configfile "$prerequisite/NuGet.Config" \
            --packages "$NUGET_PACKAGES"
          test -s "$NUGET_PACKAGES/fsharp.core/10.0.100/fsharp.core.10.0.100.nupkg"
          jq -e '.source == "https://api.nuget.org/v3/index.json"' \
            "$NUGET_PACKAGES/fsharp.core/10.0.100/.nupkg.metadata" > /dev/null

      - name: Validate downloaded tool package
        env:
          TOOL_PACKAGE_PATH: ${{ steps.candidate.outputs.tool_package_path }}
        run: dotnet fsi scripts/validate_package.fsx "$TOOL_PACKAGE_PATH"

      - name: Validate downloaded public API package and independent consumers
        env:
          PUBLIC_API_PACKAGE_PATH: ${{ steps.candidate.outputs.api_package_path }}
        run: dotnet fsi scripts/validate_public_api_package.fsx "$PUBLIC_API_PACKAGE_PATH"

      - name: Verify public API consumer compilation failure handling
        if: ${{ env.PRODUCER_ROLE == 'canonical' }}
        env:
          PUBLIC_API_PACKAGE_PATH: ${{ steps.candidate.outputs.api_package_path }}
        run: dotnet fsi scripts/test_public_api_consumer.fsx "$PUBLIC_API_PACKAGE_PATH"

      - name: Verify public API package consumer regressions
        if: ${{ env.PRODUCER_ROLE == 'canonical' }}
        env:
          PUBLIC_API_PACKAGE_PATH: ${{ steps.candidate.outputs.api_package_path }}
        run: dotnet fsi scripts/test_public_api_package.fsx "$PUBLIC_API_PACKAGE_PATH"

      - name: Verify FSI authoring dependency-manager cache isolation
        if: ${{ env.PRODUCER_ROLE == 'canonical' }}
        env:
          PUBLIC_API_PACKAGE_PATH: ${{ steps.candidate.outputs.api_package_path }}
        run: dotnet fsi scripts/test_fsi_authoring_cache.fsx "$PUBLIC_API_PACKAGE_PATH" examples/AsciiUppercase.fsx

      - name: Validate F# Interactive authoring with the downloaded API candidate
        env:
          PUBLIC_API_PACKAGE_PATH: ${{ steps.candidate.outputs.api_package_path }}
        run: dotnet fsi scripts/validate_fsi_authoring.fsx "$PUBLIC_API_PACKAGE_PATH" examples/AsciiUppercase.fsx

      - name: Install and smoke test the downloaded tool package
        env:
          TOOL_PACKAGE_PATH: ${{ steps.candidate.outputs.tool_package_path }}
          PACKAGE_VERSION: ${{ steps.candidate.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/pipel4-consumer-${SDK_VERSION}-from-${PRODUCER_SDK}/tool-install"
          tool_config="$RUNNER_TEMP/pipel4-consumer-${SDK_VERSION}-from-${PRODUCER_SDK}/tool-NuGet.Config"
          if [[ -e "$tool_root" ]]; then
            echo "Tool install directory is not fresh: $tool_root" >&2
            exit 1
          fi
          mkdir -p "$tool_root"
          cat > "$tool_config" <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="selected producer candidate" value="$(dirname "$TOOL_PACKAGE_PATH")" />
            </packageSources>
          </configuration>
          EOF
          dotnet tool install PipeL4 \
            --tool-path "$tool_root" \
            --version "$PACKAGE_VERSION" \
            --configfile "$tool_config"
          dotnet tool list --tool-path "$tool_root" | grep -iE "^PipeL4[[:space:]]+${PACKAGE_VERSION}[[:space:]]"
          "$tool_root/pipel4" --help > "$RUNNER_TEMP/pipel4-tool-help.txt"
          version_output="$("$tool_root/pipel4" --version)"
          printf '%s\n' "$version_output"
          grep -F "$PACKAGE_VERSION" <<< "$version_output"
          "$tool_root/pipel4" examples list > "$RUNNER_TEMP/pipel4-tool-examples.txt"
          grep -F AsciiUppercase "$RUNNER_TEMP/pipel4-tool-examples.txt"
          examples_root="$RUNNER_TEMP/pipel4-consumer-${SDK_VERSION}-from-${PRODUCER_SDK}/examples-copy"
          mkdir -p "$examples_root"
          "$tool_root/pipel4" examples copy AsciiUppercase --output-dir "$examples_root"
          test -s "$examples_root/AsciiUppercase.fsx"

      - name: Reverify artifact hashes after consumer validation
        if: always()
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/pipel4-distribution-${{ env.SDK_VERSION }}-from-${{ env.PRODUCER_SDK }}
          PRODUCER_ARTIFACT_ATTEMPT: ${{ steps.producer_identity.outputs.producer_attempt }}
        run: >-
          dotnet fsi --exec scripts/distribution_validation.fsx artifact
          --artifact-root "$ARTIFACT_ROOT"
          --consumer-sdk "$SDK_VERSION"
          --producer-sdk "$PRODUCER_SDK"
          --tested-sha "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --producer-attempt "$PRODUCER_ARTIFACT_ATTEMPT"

      - name: Restore SDK policy and verify dependency files are unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/pipel4-global.json" ]]; then
            cp "$RUNNER_TEMP/pipel4-global.json" global.json
          fi
          git diff --exit-code -- global.json paket.dependencies paket.lock

  consume_404_from_115:
    name: Consume canonical packages with .NET SDK 10.0.404 from producer SDK 10.0.115
    runs-on: ubuntu-24.04
    needs: produce_canonical
    env:
      SDK_VERSION: '10.0.404'
      PRODUCER_SDK: '10.0.115'
      PRODUCER_ROLE: canonical
      PRODUCER_ARTIFACT_NAME: ${{ needs.produce_canonical.outputs.artifact_name }}
      PRODUCER_ARTIFACT_ATTEMPT: ${{ needs.produce_canonical.outputs.producer_attempt }}
    steps: *consumer_steps

  consume_115_from_404:
    name: Consume compatibility packages with .NET SDK 10.0.115 from producer SDK 10.0.404
    runs-on: ubuntu-24.04
    needs: produce_compatibility
    env:
      SDK_VERSION: '10.0.115'
      PRODUCER_SDK: '10.0.404'
      PRODUCER_ROLE: compatibility
      PRODUCER_ARTIFACT_NAME: ${{ needs.produce_compatibility.outputs.artifact_name }}
      PRODUCER_ARTIFACT_ATTEMPT: ${{ needs.produce_compatibility.outputs.producer_attempt }}
    steps: *consumer_steps

  consume_404_from_404:
    name: Consume compatibility packages with .NET SDK 10.0.404 from producer SDK 10.0.404
    runs-on: ubuntu-24.04
    needs: produce_compatibility
    env:
      SDK_VERSION: '10.0.404'
      PRODUCER_SDK: '10.0.404'
      PRODUCER_ROLE: compatibility
      PRODUCER_ARTIFACT_NAME: ${{ needs.produce_compatibility.outputs.artifact_name }}
      PRODUCER_ARTIFACT_ATTEMPT: ${{ needs.produce_compatibility.outputs.producer_attempt }}
    steps: *consumer_steps

  validate:
    name: Build and validate distributable packages
    needs:
      - produce_canonical
      - produce_compatibility
      - consume_115_from_115
      - consume_404_from_115
      - consume_115_from_404
      - consume_404_from_404
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install aggregate validation SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.115'

      - name: Pin and verify aggregate validation SDK
        env:
          SDK_VERSION: '10.0.115'
        shell: bash
        run: |
          set -euo pipefail
          cp global.json "$RUNNER_TEMP/pipel4-global.json"
          jq --arg sdk "$SDK_VERSION" '.sdk.version = $sdk | .sdk.rollForward = "disable"' \
            global.json > "$RUNNER_TEMP/pipel4-aggregate-global.json"
          cp "$RUNNER_TEMP/pipel4-aggregate-global.json" global.json
          selected_sdk="$(dotnet --version)"
          printf 'Requested aggregate validation SDK: %s; selected .NET SDK: %s\n' "$SDK_VERSION" "$selected_sdk"
          test "$selected_sdk" = "$SDK_VERSION"
          dotnet --info
          dotnet --list-sdks

      - name: Require every producer and consumer job to succeed
        env:
          PRODUCE_CANONICAL_RESULT: ${{ needs.produce_canonical.result }}
          PRODUCE_COMPATIBILITY_RESULT: ${{ needs.produce_compatibility.result }}
          CONSUME_115_FROM_115_RESULT: ${{ needs.consume_115_from_115.result }}
          CONSUME_404_FROM_115_RESULT: ${{ needs.consume_404_from_115.result }}
          CONSUME_115_FROM_404_RESULT: ${{ needs.consume_115_from_404.result }}
          CONSUME_404_FROM_404_RESULT: ${{ needs.consume_404_from_404.result }}
        run: >-
          dotnet fsi --exec scripts/distribution_validation.fsx aggregate
          --produce-canonical "$PRODUCE_CANONICAL_RESULT"
          --produce-compatibility "$PRODUCE_COMPATIBILITY_RESULT"
          --consume-115-from-115 "$CONSUME_115_FROM_115_RESULT"
          --consume-404-from-115 "$CONSUME_404_FROM_115_RESULT"
          --consume-115-from-404 "$CONSUME_115_FROM_404_RESULT"
          --consume-404-from-404 "$CONSUME_404_FROM_404_RESULT"

      - name: Restore SDK policy and verify dependency files are unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/pipel4-global.json" ]]; then
            cp "$RUNNER_TEMP/pipel4-global.json" global.json
          fi
          git diff --exit-code -- global.json paket.dependencies paket.lock
